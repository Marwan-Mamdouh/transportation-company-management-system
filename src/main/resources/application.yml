spring:
  application:
    name: buses
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # this part is only needed for testing because spring can configure it automatically
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/Buses}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: ALWAYS
    include-binding-errors: ALWAYS
    include-stacktrace: NEVER

logging:
  file:
    name: app.log

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
